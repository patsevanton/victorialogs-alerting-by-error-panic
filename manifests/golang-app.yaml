apiVersion: apps/v1
kind: Deployment
metadata:
  name: golang-app
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: golang-app
  template:
    metadata:
      labels:
        app: golang-app
    spec:
      containers:
        - name: golang-app
          image: ghcr.io/patsevanton/victorialogs-alerting-by-error-panic-golang:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: golang-app
  namespace: apps
spec:
  selector:
    app: golang-app
  ports:
    - port: 8080
      targetPort: 8080
