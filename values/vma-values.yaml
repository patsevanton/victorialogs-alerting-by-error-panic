# Отдельный vmalert (chart victoria-metrics-alert) — вариант 2.
# Правила берём из того же файла ConfigMap `vmalert-rules`, datasource = VictoriaLogs.
nameOverride: vma

server:
  # datasource = VictoriaLogs.
  datasource:
    url: "http://vls-server.vmks.svc.cluster.local:9428"
  # notifier = Alertmanager из vmks.
  notifier:
    url: "http://vmalertmanager-vmks-victoria-metrics-k8s-stack.vmks.svc.cluster.local:9093"
  # Состояние алертов пишем в vmsingle (VictoriaLogs метрики не хранит).
  remoteWrite:
    url: "http://vmsingle-vmks-victoria-metrics-k8s-stack.vmks.svc.cluster.local:8428/api/v1/write"
  remoteRead:
    url: "http://vmsingle-vmks-victoria-metrics-k8s-stack.vmks.svc.cluster.local:8428"

  # Правила из файла (тот же ConfigMap, что и у встроенного vmalert).
  configMap: vmalert-rules
  extraArgs:
    rule: "/config/alert-rules.yaml"
    rule.defaultRuleType: vlogs

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi

alertmanager:
  enabled: false
